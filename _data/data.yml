    summary: |
      As a Senior Odoo Developer with 5+ years of experience, I specialize in building and customizing ERP solutions using Odoo (Python, JavaScript). My expertise spans full-cycle implementation, module development, and system integration (SAP, WordPress, Flutter, Android APIs).

      Key strengths:
      - Odoo specialist (versions 8-18, Community/Enterprise)
      - Full-stack development (Python, PostgreSQL, XML, OWL JS)
      - Cloud deployment (AWS, Digital Ocean)
      - Cross-functional team leadership
      - Business process optimization

      I thrive in challenging environments that require technical innovation and problem-solving to drive business value.

